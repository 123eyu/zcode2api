<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ZCode 多账号额度管理、网关密钥与请求用量控制台。">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161719">
<title>zcode2api 控制台</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
<script>
  (function () {
    var t = localStorage.getItem('z2a_theme');
    if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
</head>
<body>
<a class="skip-link" href="#main">跳转到主要内容</a>
<div id="login-view" class="login-wrap hidden">
  <form id="login-form" class="login-card">
    <img class="login-logo" src="/favicon.svg" alt="" width="40" height="40">
    <h1>zcode2api</h1>
    <div class="pw-wrap">
      <label class="visually-hidden" for="login-password">管理员密码</label>
      <input type="password" id="login-password" placeholder="管理员密码" autocomplete="current-password" required>
      <button type="button" class="pw-toggle" id="pw-toggle" aria-label="显示密码" aria-pressed="false">
        <svg class="lucide" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button type="submit" class="btn primary">登录</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<div id="app-view" class="hidden">
  <div class="shell">
    <header class="app-toolbar">
      <a class="toolbar-brand" href="#/dashboard" data-page="dashboard">
        <img src="/favicon.svg" alt="" width="28" height="28">
        <span>zcode2api</span>
      </a>
      <div class="app-toolbar-actions">
        <span class="app-ports" id="ports-label" title="端口修改需编辑 config.json 后重启服务"></span>
        <button type="button" class="toolbar-button" id="theme-btn" aria-label="切换亮/暗主题" title="切换亮/暗主题"></button>
        <button type="button" class="toolbar-button" id="logout-btn">
          <svg class="lucide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          退出
        </button>
      </div>
    </header>
    <main id="main" class="container-7xl"></main>
  </div>
  <nav id="nav" class="dock-wrap" aria-label="页面导航"></nav>
</div>
<script src="/ui-state.js"></script>
<script src="/dashboard-charts.js"></script>
<script src="/claims-view.js"></script>
<script src="/cache-details.js"></script>
<script src="/logs-view.js"></script>
<script src="/update-view.js"></script>
<script src="/settings-view.js"></script>
<script src="/app.js"></script>
</body>
</html>
